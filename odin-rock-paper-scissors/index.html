<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="script.js" defer></script>
    <style>
        body{
            text-align: center;
            margin-top: 50px;
            font-weight: 700;
            font-family: Calibri, sans-serif;
        }

        p{
            font-size: 32px;
        }

        button{
            font-size: 24px;
            padding: 5px 10px;
            margin: 6px;
        }
    </style>
</head>
<body>
    <div class="buttons">
        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissors">Scissors</button>
    </div>

    <div class="output">
        <p id="round/o">
            - -
        </p>
        <p id="score">
            &emsp; &nbsp; YOU &nbsp; : &nbsp; COMPUTER <br>
            0 &emsp; &emsp; &emsp; &nbsp; 0
        </p>
    </div>
</body>
</html>
